name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (WPF app + tests)
        run: dotnet build SotheOptimizer.sln -c Release
      - name: Test
        run: dotnet test tests/SotheOptimizer.Tests -c Release --no-build
